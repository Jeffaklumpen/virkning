name: Crochet app smoke tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check js/app.js
      - run: node --check js/views.js
      - run: node --check js/overview.js
      - run: node --check js/guide-loader.js
      - run: node --check tools/encrypt-pattern.mjs
      - run: node --check tools/encrypt-cover.mjs
      - run: node --test tests/smoke.test.mjs
